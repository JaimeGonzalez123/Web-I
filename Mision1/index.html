<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>El oráculo de los números</title>
    <script src="app.js" defer></script>
  </head>
  <body>
    <h1>🔮 El oráculo de los números</h1>
    <p>He pensado un número del 1 al 100. ¿Te atreves?</p>
    <input id="intento" type="number" min="1" max="100" />
    <button id="probar">Consultar al oráculo</button>
    <p id="respuesta">El oráculo espera...</p>
    <p id="marcador"></p>
  </body>
</html>
